<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="refresh" content="3; url=/geoagora/" />
  <title>Redirecting to GeoAgora…</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://winlew.co/geoagora/" />
  <style>
    :root{
      --bg:#07111f;--bg2:#081626;--text:#eef6ff;--muted:rgba(223,236,255,.85);--line:rgba(111,181,255,.16);--cyan:#3fd7ff;--violet:#9d62ff;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:radial-gradient(800px 420px at 10% 0%, rgba(63,215,255,.12), transparent 58%),radial-gradient(760px 460px at 100% 0%, rgba(157,98,255,.12), transparent 54%),linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%)}
    .card{max-width:720px;width:100%;padding:30px;border-radius:26px;border:1px solid rgba(255,255,255,.08);background:rgba(8,18,34,.78);box-shadow:0 28px 80px rgba(0,0,0,.4);text-align:center}
    h1{margin:0 0 10px;font-size:clamp(34px,5vw,56px);letter-spacing:-1px}
    p{margin:0 auto 18px;max-width:54ch;color:var(--muted);line-height:1.7}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(90deg, rgba(63,215,255,.14), rgba(157,98,255,.14));color:var(--text);font-weight:800;text-decoration:none}
    .small{margin-top:14px;font-size:13px;color:var(--muted)}
  </style>
  <script>
    setTimeout(function(){ location.replace('/geoagora/'); }, 500);
  </script>
</head>
<body>
  <div class="card">
    <h1>GeoAgora</h1>
    <p>You found the GeoAgora preview entry. Sending you to the live preview route now so you land on the proper staging page instead of a blank endpoint.</p>
    <a class="btn" href="/geoagora/">Continue to /geoagora/</a>
    <div class="small">If redirect does not fire automatically, use the button above.</div>
  </div>
</body>
</html>
