<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting to WinLEW Profile…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://winlew.co/verify/profile.html" />
  <meta http-equiv="refresh" content="0; url=/verify/profile.html" />
  <script>
    (function () {
      var target = "/verify/profile.html";
      var next = target + window.location.search + window.location.hash;
      window.location.replace(next);
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(180deg, #120703 0%, #1b0904 100%);
      color: #f8efe8; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      width: min(560px, calc(100vw - 32px)); padding: 28px; border-radius: 24px;
      background: rgba(52, 25, 14, 0.82); border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 18px 60px rgba(0,0,0,0.38);
    }
    .eyebrow { display:inline-block; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.09); font-size:12px; font-weight:700; letter-spacing:0.04em; margin-bottom:14px;}
    h1 { margin:0 0 10px; font-size:36px; line-height:1.05; }
    p { margin:0; font-size:18px; line-height:1.6; color:#dfcfc3; }
    a { color:#f7d89b; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">WinLEW Profile Redirect</div>
    <h1>Opening your profile…</h1>
    <p>You are being redirected to the live profile page at <a href="/verify/profile.html">/verify/profile.html</a>.</p>
  </main>
</body>
</html>
